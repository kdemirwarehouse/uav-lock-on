# =========================================
# uav-lock-on configuration
# =========================================

source:
  path: "videos/test.mp4"      # video file path, or 0 for webcam

detector:
  weights: "weights/best.pt"   # trained YOLO model
  img_size: 640                # must match training imgsz (960 was worse)
  conf_threshold: 0.25         # 0.4 missed frames on real video
  # Question 1: what do we TRACK? -> anything that flies (not birds)
  track_classes: [drone, aircraft, helicopter]

tracker:
  type: "kcf"                  # faster than csrt on CPU (~15 vs ~6 FPS at N=5)
  detect_every_n_frames: 5     # run YOLO once every N frames
  vote_window: 10              # last N detections used for class voting

lock:
  # Question 2: what do we LOCK ON? -> decided by the voted class
  target_classes: [drone, aircraft]
  # Lock region as fractions of the frame (0.0 - 1.0)
  # TODO: verify with current Teknofest Savasan IHA rules
  region:
    x_min: 0.25
    y_min: 0.10
    x_max: 0.75
    y_max: 0.90
  min_box_ratio: 0.05          # box width or height must be >= 5% of frame
  lock_duration_s: 4.0         # seconds the conditions must hold
  max_lost_frames: 5           # tolerance: frames target can be lost

output:
  show_window: true
  save_video: true
  video_path: "outputs/result.mp4"
  log_path: "logs/lock_events.json"